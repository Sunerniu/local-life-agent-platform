# 容器版 nginx 配置，对应原 nginx-1.18.0/conf/nginx.conf
# 唯一区别：/api 反向代理的目标从 127.0.0.1:8081 换成 host.docker.internal:8081，
# 因为 Spring Boot 跑在宿主机（IDEA / mvn）上，容器里的 127.0.0.1 指的是容器自己。

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/json;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       8080;
        server_name  localhost;

        # 本地暂不启用登录，统一展示游客浏览说明。
        location = /login2.html {
            return 302 /login.html;
        }

        # 前端项目位置（挂载自 ./nginx-1.18.0/html）
        location / {
            root   /usr/share/nginx/html/hmdp;
            index  index.html index.htm;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }

        location /api {
            proxy_read_timeout 300s;
            default_type  application/json;
            keepalive_timeout   30s;
            keepalive_requests  1000;
            proxy_http_version 1.1;
            rewrite /api(/.*) $1 break;
            proxy_pass_request_headers on;
            proxy_next_upstream error timeout;
            proxy_pass http://host.docker.internal:8081;

            # 上传探店图片默认 1MB 会被拦，放宽一点
            client_max_body_size 10m;
        }
    }
}
